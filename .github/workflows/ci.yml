name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      FRAMEBRIDGE_FIXTURE_BROWSER: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q scripts tests
      - run: python scripts/check_docs.py
      - run: python scripts/audit_public.py --history
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
      - name: Check launcher syntax and dry run
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/start_edge.ps1), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw 'PowerShell parser errors' }
          ./scripts/start_edge.ps1 -DryRun -Port 49333
  browser-fixtures:
    name: Isolated mocked browser / Windows
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      FRAMEBRIDGE_FIXTURE_BROWSER: msedge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-browser.txt
      # Fixture contexts intercept every page request and block service workers.
      # No CDP launcher, user profile, ChatGPT credentials, or real generation.
      - run: python -m unittest discover -s tests -p test_browser_fixture.py -v
